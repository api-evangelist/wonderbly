description: 'Wonderbly is an online publisher that makes personalized books and gifts for kids and
  adults. Founded in 2013 (originally as Lost My Name), it lets customers design and buy books customized
  with a recipient''s name, themes, and occasion, and has delighted over 10 million readers worldwide.
  The consumer e-commerce site operates across 40+ language and regional storefronts (US, UK, AU, CA,
  DE, FR, NL, IT, ES). Backed by GV. No public developer API, developer portal, or API documentation
  was found during enrichment; this remains a company profile lead in the API Evangelist network.'
